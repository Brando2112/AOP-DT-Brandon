<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Singgah - Wisata Indonesia</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="melvern-brandon-portal">
    <div class="melvern-brandon-portal-kartu">
      <img class="melvern-brandon-portal-logo" src="logo.png" alt="Logo Santa Laurensia">
      <h2>Masuk ke akun Anda</h2>
      <p class="melvern-brandon-portal-sub">Gunakan username dan password sekolah.</p>

      <p class="melvern-brandon-isian-nama">Username</p>
      <input class="melvern-brandon-isian" type="text" id="melvern-brandon-username" name="username" placeholder="Masukkan username">

      <p class="melvern-brandon-isian-nama">Password</p>
      <input class="melvern-brandon-isian" type="password" id="melvern-brandon-password" name="password" placeholder="Masukkan password">

      <div class="melvern-brandon-portal-baris">
        <p class="melvern-brandon-ingat"><input class="melvern-brandon-centang" type="checkbox" id="melvern-brandon-ingat" name="ingat"> Ingat saya</p>
        <a class="melvern-brandon-lupa" href="#">Lupa password?</a>
      </div>

      <a class="melvern-brandon-tombol-portal" href="beranda.html">Masuk</a>
    </div>
  </section>
</body>
</html>
